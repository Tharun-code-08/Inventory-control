/*
  Nginx SPA + cache + security headers for Retail IMS web (apps/web/dist).
  Prevents stale index.html from referencing deleted JS chunks after deploy.

  Example server block snippet:

  root /var/www/retail-ims/web;
  index index.html;

  # ── Security headers (all responses) ──
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ── HTML — never cache ──
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # ── Hashed assets — cache forever ──
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # ── Static files (fonts, images, manifests) — cache with revalidation ──
  location ~* \.(woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|webmanifest)$ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
  }

  # ── SPA fallback ──
  location / {
    try_files $uri $uri/ /index.html;
  }
*/
