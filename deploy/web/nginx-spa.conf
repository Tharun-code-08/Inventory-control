/*
  Nginx SPA + cache headers for Retail IMS web (apps/web/dist).
  Prevents stale index.html from referencing deleted JS chunks after deploy.

  Example server block snippet:

  root /var/www/retail-ims/web;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
*/
