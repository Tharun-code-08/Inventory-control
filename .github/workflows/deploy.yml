name: Deploy to Production

# Gate: only deploy after CI Quality Gate passes on main.
# This prevents racing against CI and deploying broken commits.
on:
  workflow_run:
    workflows: ["CI Quality Gate"]
    types: [completed]
    branches: [main]

# Least-privilege: checkout only needs read; SSH deploy uses its own key.
permissions:
  contents: read

# Queue deploys rather than cancelling mid-flight.
# cancel-in-progress: false ensures a running deployment finishes before the
# next one starts — partial deploys are far worse than a short queue.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy API to VPS
    timeout-minutes: 30
    # Only proceed when the upstream Quality Gate actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # GitHub Environment: enables required reviewers, wait timers, deployment
    # history, and environment-scoped secrets on GitHub.
    # Set up at: Settings → Environments → production
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Check out the exact commit that passed CI, not whatever HEAD is now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # REQUIRED FOR PRODUCTION: set this secret to the output of
          # `ssh-keyscan -H <your-host>` run from a trusted machine.
          # This is the only way to fully prevent MITM attacks against deploys.
          DEPLOY_HOST_KNOWN_KEY: ${{ secrets.DEPLOY_HOST_KNOWN_KEY }}
        run: |
          # Trim secrets (pasted values may have trailing newlines/spaces)
          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"

          # Validate required secrets
          if [ -z "$DEPLOY_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "❌ Missing required secrets: DEPLOY_KEY, DEPLOY_HOST, or DEPLOY_USER"
            exit 1
          fi

          # Install SSH key (printf preserves newlines; echo may mangle them on some runners)
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configure host-key verification.
          #
          # REQUIRED FOR PRODUCTION: set the DEPLOY_HOST_KNOWN_KEY secret to
          # the output of `ssh-keyscan -H <your-host>` run from a trusted machine.
          # This is the only way to fully prevent MITM attacks against deploys.
          #
          # The accept-new fallback below is a TRANSITIONAL default only.
          # It accepts the host key on the first connection and rejects any
          # change afterward — safer than StrictHostKeyChecking=no, but still
          # vulnerable on first contact. Do not rely on this permanently.
          if [ -n "$DEPLOY_HOST_KNOWN_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KNOWN_KEY" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            SSH_STRICT="-o StrictHostKeyChecking=yes"
          else
            echo "⚠️  DEPLOY_HOST_KNOWN_KEY is not set. Using accept-new as a transitional fallback."
            echo "    Set this secret (ssh-keyscan -H <host>) to enable strict host verification."
            SSH_STRICT="-o StrictHostKeyChecking=accept-new"
          fi

          # Run deployment script.
          # Pull latest code first so deploy.sh itself is up-to-date before
          # it executes (git pull inside deploy.sh updates files on disk but
          # the already-running process keeps the old in-memory script).
          echo "🚀 Connecting to $USER@$HOST..."
          ssh -i ~/.ssh/deploy_key \
            $SSH_STRICT \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$USER@$HOST" \
            "git -C /opt/Inventory-control-prod pull origin main --quiet && /opt/Inventory-control-prod/scripts/deploy.sh prod"

      - name: Post-deployment verification
        # Independently verifies the running process from outside deploy.sh.
        # Four checks:
        #   1. Liveness   — /health returns HTTP 200 and status:"ok"
        #   2. Readiness  — /health/ready returns database:"connected"
        #   3. Identity   — /health/live commit SHA matches the deployed commit
        #   4. Public URL — HTTPS endpoint through nginx responds HTTP 200
        #
        # Each check retries up to 10 times (3s apart) to absorb brief startup
        # jitter — deploy.sh already waits for PM2, but nginx or upstream buffers
        # may still be draining. Failure marks the GitHub Environment deployment
        # as failed without requiring a separate alerting tool.
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KNOWN_KEY: ${{ secrets.DEPLOY_HOST_KNOWN_KEY }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          # Set at repo or environment level (Settings → Variables).
          # Used for the public HTTPS check. Skipped if absent.
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"

          # Reuse the SSH key and host-key config written by the Deploy step.
          if [ -n "$DEPLOY_HOST_KNOWN_KEY" ]; then
            SSH_STRICT="-o StrictHostKeyChecking=yes"
          else
            SSH_STRICT="-o StrictHostKeyChecking=accept-new"
          fi
          SSH="ssh -i ~/.ssh/deploy_key $SSH_STRICT -o ConnectTimeout=15 -o ServerAliveInterval=10 $USER@$HOST"

          MAX=10
          DELAY=3

          # fetch_with_retry <label> <curl-command>
          # Retries <MAX> times with <DELAY>s between attempts.
          # Prints the response body and returns it in FETCH_RESULT.
          # Exits 1 if all attempts fail or the response is not valid JSON,
          # printing a diagnostic that distinguishes "no response" from "bad body".
          fetch_with_retry() {
            local label="$1" cmd="$2"
            local body="" attempt=0
            while [ $attempt -lt $MAX ]; do
              attempt=$((attempt + 1))
              body=$(eval "$cmd" 2>/dev/null) && break
              echo "  attempt $attempt/$MAX failed, retrying in ${DELAY}s..."
              [ $attempt -lt $MAX ] && sleep $DELAY
            done
            if [ -z "$body" ]; then
              echo "❌ $label: all $MAX attempts failed — endpoint unreachable or returned empty"
              return 1
            fi
            # Validate JSON before any caller tries to parse it.
            # A non-JSON body (nginx error page, HTML, plain text) produces a
            # clear diagnostic rather than a cryptic node parse-error traceback.
            if ! echo "$body" | node -e "
              let s='';
              process.stdin.on('data',d=>s+=d).on('end',()=>{
                try { JSON.parse(s); }
                catch(e) {
                  const preview=s.slice(0,120).replace(/\n/g,' ');
                  process.stderr.write('Response is not valid JSON. First 120 chars: '+preview+'\n');
                  process.exit(1);
                }
              })
            " 2>&1; then
              return 1
            fi
            echo "$body"
            FETCH_RESULT="$body"
          }

          # extract <json> <field>
          # Reads a top-level string field from JSON via Node; returns empty on missing.
          extract() {
            local json="$1" field="$2"
            echo "$json" | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d)['$field']??''))"
          }

          # ── [1/4] Liveness ──────────────────────────────────────────────────
          echo "--- [1/4] Liveness (/api/v1/health) ---"
          fetch_with_retry "Liveness" "$SSH 'curl -sf http://localhost:3001/api/v1/health'" || exit 1
          STATUS=$(extract "$FETCH_RESULT" status)
          [ "$STATUS" = "ok" ] || { echo "❌ Liveness: status='$STATUS' (expected 'ok')"; exit 1; }
          echo "✓ Liveness: status=ok"

          # ── [2/4] Readiness ─────────────────────────────────────────────────
          echo "--- [2/4] Readiness (/api/v1/health/ready) ---"
          fetch_with_retry "Readiness" "$SSH 'curl -sf http://localhost:3001/api/v1/health/ready'" || exit 1
          DB=$(extract "$FETCH_RESULT" database)
          [ "$DB" = "connected" ] || { echo "❌ Readiness: database='$DB' (expected 'connected')"; exit 1; }
          echo "✓ Readiness: database=connected"

          # ── [3/4] Identity ──────────────────────────────────────────────────
          echo "--- [3/4] Identity (/api/v1/health/live) ---"
          fetch_with_retry "Identity" "$SSH 'curl -sf http://localhost:3001/api/v1/health/live'" || exit 1
          ACTUAL_SHA=$(extract "$FETCH_RESULT" commit)
          # Normalize to 40 chars — guards against short-SHA vs full-SHA mismatches.
          EXPECTED_NORM="${EXPECTED_SHA:0:40}"
          ACTUAL_NORM="${ACTUAL_SHA:0:40}"
          if [ "$ACTUAL_NORM" = "unknown" ] || [ -z "$ACTUAL_NORM" ]; then
            echo "⚠️  Commit SHA not set (APP_COMMIT_SHA env var missing from PM2). Identity skipped."
          elif [ "$ACTUAL_NORM" != "$EXPECTED_NORM" ]; then
            echo "❌ Identity: running=$ACTUAL_NORM expected=$EXPECTED_NORM"
            exit 1
          else
            echo "✓ Identity: commit=${ACTUAL_NORM:0:12}... matches deployed SHA"
          fi

          # ── [4/4] Public URL ────────────────────────────────────────────────
          if [ -z "$PRODUCTION_URL" ]; then
            echo "--- [4/4] Public URL check skipped (PRODUCTION_URL variable not set) ---"
            echo "    Set it at Settings → Variables → PRODUCTION_URL (e.g. https://api.example.com)"
          else
            echo "--- [4/4] Public URL ($PRODUCTION_URL/api/v1/health) ---"
            PUB_CODE=""
            for i in $(seq 1 $MAX); do
              PUB_CODE=$(curl -sf -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/api/v1/health" 2>/dev/null) && break
              echo "  attempt $i/$MAX failed, retrying in ${DELAY}s..."
              [ $i -lt $MAX ] && sleep $DELAY
            done
            if [ -z "$PUB_CODE" ]; then
              echo "❌ Public URL: all $MAX attempts failed (nginx down, TLS error, or DNS failure)"
              exit 1
            fi
            [ "$PUB_CODE" = "200" ] || { echo "❌ Public URL: HTTP $PUB_CODE (expected 200) — check nginx config, TLS cert, or firewall"; exit 1; }
            echo "✓ Public URL: HTTP 200"
          fi

      - name: Deployment Status
        if: success()
        run: echo "✅ Deployment verified - ${{ github.event.workflow_run.head_sha }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed for ${{ github.event.workflow_run.head_sha }}"
