name: Deploy to Production

# Gate: only deploy after CI Quality Gate passes on main.
# This prevents racing against CI and deploying broken commits.
on:
  workflow_run:
    workflows: ["CI Quality Gate"]
    types: [completed]
    branches: [main]

# Least-privilege: checkout only needs read; SSH deploy uses its own key.
permissions:
  contents: read

# Queue deploys rather than cancelling mid-flight.
# cancel-in-progress: false ensures a running deployment finishes before the
# next one starts — partial deploys are far worse than a short queue.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy API to VPS
    timeout-minutes: 30
    # Only proceed when the upstream Quality Gate actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # GitHub Environment: enables required reviewers, wait timers, deployment
    # history, and environment-scoped secrets on GitHub.
    # Set up at: Settings → Environments → production
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Check out the exact commit that passed CI, not whatever HEAD is now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # REQUIRED FOR PRODUCTION: set this secret to the output of
          # `ssh-keyscan -H <your-host>` run from a trusted machine.
          # This is the only way to fully prevent MITM attacks against deploys.
          DEPLOY_HOST_KNOWN_KEY: ${{ secrets.DEPLOY_HOST_KNOWN_KEY }}
        run: |
          # Trim secrets (pasted values may have trailing newlines/spaces)
          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"

          # Validate required secrets
          if [ -z "$DEPLOY_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "❌ Missing required secrets: DEPLOY_KEY, DEPLOY_HOST, or DEPLOY_USER"
            exit 1
          fi

          # Install SSH key (printf preserves newlines; echo may mangle them on some runners)
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configure host-key verification.
          #
          # REQUIRED FOR PRODUCTION: set the DEPLOY_HOST_KNOWN_KEY secret to
          # the output of `ssh-keyscan -H <your-host>` run from a trusted machine.
          # This is the only way to fully prevent MITM attacks against deploys.
          #
          # The accept-new fallback below is a TRANSITIONAL default only.
          # It accepts the host key on the first connection and rejects any
          # change afterward — safer than StrictHostKeyChecking=no, but still
          # vulnerable on first contact. Do not rely on this permanently.
          if [ -n "$DEPLOY_HOST_KNOWN_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KNOWN_KEY" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            SSH_STRICT="-o StrictHostKeyChecking=yes"
          else
            echo "⚠️  DEPLOY_HOST_KNOWN_KEY is not set. Using accept-new as a transitional fallback."
            echo "    Set this secret (ssh-keyscan -H <host>) to enable strict host verification."
            SSH_STRICT="-o StrictHostKeyChecking=accept-new"
          fi

          # Run deployment script.
          # Pull latest code first so deploy.sh itself is up-to-date before
          # it executes (git pull inside deploy.sh updates files on disk but
          # the already-running process keeps the old in-memory script).
          echo "🚀 Connecting to $USER@$HOST..."
          ssh -i ~/.ssh/deploy_key \
            $SSH_STRICT \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$USER@$HOST" \
            "git -C /opt/Inventory-control-prod pull origin main --quiet && /opt/Inventory-control-prod/scripts/deploy.sh prod"

      - name: Post-deployment verification
        # Independently verify the running process from outside deploy.sh.
        # Three checks:
        #   1. Liveness  — /health returns HTTP 200 and status:"ok"
        #   2. Readiness — /health/ready returns database:"connected"
        #   3. Identity  — /health/live returns the commit SHA we just deployed
        #
        # deploy.sh already rolls back on its own health-check failure, but this
        # step catches edge cases (nginx misconfiguration, stale PM2 process, etc.)
        # that would make deploy.sh succeed while the app is not actually serving.
        # Failure here marks the GitHub deployment as failed in the environment log.
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KNOWN_KEY: ${{ secrets.DEPLOY_HOST_KNOWN_KEY }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"

          # Reuse the SSH key written by the Deploy step above.
          if [ -n "$DEPLOY_HOST_KNOWN_KEY" ]; then
            SSH_STRICT="-o StrictHostKeyChecking=yes"
          else
            SSH_STRICT="-o StrictHostKeyChecking=accept-new"
          fi

          SSH="ssh -i ~/.ssh/deploy_key $SSH_STRICT -o ConnectTimeout=15 -o ServerAliveInterval=10 $USER@$HOST"

          echo "--- [1/3] Liveness check (/api/v1/health) ---"
          HEALTH=$($SSH "curl -sf http://localhost:3001/api/v1/health")
          echo "$HEALTH"
          STATUS=$(echo "$HEALTH" | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).status??''))")
          if [ "$STATUS" != "ok" ]; then
            echo "❌ Liveness check failed: status='$STATUS' (expected 'ok')"
            exit 1
          fi
          echo "✓ Liveness: status=ok"

          echo "--- [2/3] Readiness check (/api/v1/health/ready) ---"
          READY=$($SSH "curl -sf http://localhost:3001/api/v1/health/ready")
          echo "$READY"
          DB=$(echo "$READY" | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).database??''))")
          if [ "$DB" != "connected" ]; then
            echo "❌ Readiness check failed: database='$DB' (expected 'connected')"
            exit 1
          fi
          echo "✓ Readiness: database=connected"

          echo "--- [3/3] Identity check (/api/v1/health/live) ---"
          LIVE=$($SSH "curl -sf http://localhost:3001/api/v1/health/live")
          echo "$LIVE"
          ACTUAL_SHA=$(echo "$LIVE" | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).commit??''))")
          if [ "$ACTUAL_SHA" = "unknown" ] || [ -z "$ACTUAL_SHA" ]; then
            echo "⚠️  Commit SHA not set in running process (APP_COMMIT_SHA env var missing from PM2)."
            echo "    Deploy succeeded but identity could not be verified."
          elif [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ Identity check failed: running=$ACTUAL_SHA expected=$EXPECTED_SHA"
            exit 1
          else
            echo "✓ Identity: commit=$ACTUAL_SHA matches deployed SHA"
          fi

      - name: Deployment Status
        if: success()
        run: echo "✅ Deployment verified - ${{ github.event.workflow_run.head_sha }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed for ${{ github.event.workflow_run.head_sha }}"
