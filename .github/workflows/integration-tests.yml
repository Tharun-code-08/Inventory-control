# Runs from the retail-ims repo root when this folder is the GitHub repository root.
name: Integration Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api-business-workflows:
    name: API business workflows
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail_ims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_ims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retail:retail@localhost:5432/retail_ims
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_must_be_at_least_32_characters_long
      REFRESH_SECRET: ci_refresh_secret_must_be_at_least_32_chars
      COOKIE_SECRET: ci_cookie_secret_must_be_at_least_32_chars
      WEB_ORIGIN: http://127.0.0.1:5200
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      EXPORT_STORAGE_DIR: ./storage/exports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run prisma:generate --workspace=api
      # CI uses an ephemeral DB: push the current schema directly instead of
      # replaying the (production-baselined, non-linear) migration history.
      - run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate --accept-data-loss
      # db push omits hand-written PL/pgSQL triggers; reapply the stock-ledger ones.
      - run: npx prisma db execute --schema apps/api/prisma/schema.prisma --file apps/api/prisma/ci-runtime-objects.sql
      - run: npm run db:seed --workspace=api
      - run: npm run test:e2e:workflows --workspace=api -- --runInBand

  playwright-mobile:
    name: Playwright (Phase 8 mobile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail_ims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_ims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retail:retail@localhost:5432/retail_ims
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_must_be_at_least_32_characters_long
      REFRESH_SECRET: ci_refresh_secret_must_be_at_least_32_chars
      COOKIE_SECRET: ci_cookie_secret_must_be_at_least_32_chars
      WEB_ORIGIN: http://127.0.0.1:5200
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      EXPORT_STORAGE_DIR: ./storage/exports
      CI: true
      PLAYWRIGHT_SKIP_WEBSERVER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run prisma:generate --workspace=api
      - run: |
          npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate --accept-data-loss
          npx prisma db execute --schema apps/api/prisma/schema.prisma --file apps/api/prisma/ci-runtime-objects.sql
          npm run db:seed --workspace=api
      - run: npm run build
      - run: npx playwright install chromium --with-deps
        working-directory: apps/web
      - run: |
          npm run start --workspace=api &
          npm run preview --workspace=web -- --host 127.0.0.1 --port 5200 &
      - run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/v1/health > /dev/null &&
            curl -sf http://127.0.0.1:5200 > /dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: npm run test:e2e --workspace=web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
