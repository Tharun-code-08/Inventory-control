name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least-privilege: this workflow only reads the repository.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        # shellcheck is pre-installed on ubuntu-latest runners.
        # SC2086 (word-splitting on unquoted vars) is left enabled — we want it.
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Prisma client cache
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: apps/api/node_modules/.prisma
          # Key includes lockfile (captures Prisma CLI version) and Node version
          # so a dependency bump or runtime upgrade forces regeneration.
          key: prisma-node20-${{ hashFiles('apps/api/prisma/schema.prisma', 'package-lock.json') }}

      - name: Generate Prisma client
        # @prisma/client types must exist before tsc and tests run.
        # Skipped when the cache key matches — schema and lockfile are unchanged.
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: npm run prisma:generate --workspace=api

      - name: Build
        # Compiles TypeScript for all workspaces; tsc errors surface here.
        run: npm run build

      - name: Typecheck (spec files)
        # nest build uses tsconfig.build.json which excludes **/*spec.ts.
        # This separate tsc pass catches type errors in test files that the
        # build step silently skips.
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Run tests
        run: npm run test --workspace=api

      - name: Lint
        run: npm run lint --workspace=api --if-present
