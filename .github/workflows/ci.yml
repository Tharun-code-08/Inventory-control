name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-progress runs for the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Prisma client cache
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: apps/api/node_modules/.prisma
          key: prisma-${{ hashFiles('apps/api/prisma/schema.prisma') }}

      - name: Generate Prisma client
        # @prisma/client types must exist before tsc and tests run.
        # Skipped when the cache hit matches the current schema hash.
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: npm run prisma:generate --workspace=api

      - name: Build
        # Compiles TypeScript for all workspaces; tsc errors surface here.
        run: npm run build

      - name: Typecheck (spec files)
        # nest build uses tsconfig.build.json which excludes **/*spec.ts.
        # This separate tsc pass catches type errors in test files that the
        # build step silently skips.
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Run tests
        run: npm run test --workspace=api

      - name: Lint
        run: npm run lint --workspace=api --if-present
