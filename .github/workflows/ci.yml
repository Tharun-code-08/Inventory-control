name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-progress runs for the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # @prisma/client types must exist before tsc and tests run.
        run: npm run prisma:generate --workspace=api

      - name: Build
        # Compiles TypeScript for all workspaces; tsc errors surface here.
        run: npm run build

      - name: Run tests
        run: npm run test --workspace=api

      - name: Lint
        run: npm run lint --workspace=api --if-present
