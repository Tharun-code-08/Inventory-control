name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Run tests
        run: npm run test --workspace=api

      - name: Lint
        run: npm run lint --workspace=api --if-present
