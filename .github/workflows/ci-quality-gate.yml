name: CI Quality Gate

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-progress runs for the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci

      - name: Restore Prisma client cache
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: apps/api/node_modules/.prisma
          key: prisma-${{ hashFiles('apps/api/prisma/schema.prisma') }}

      - name: Generate Prisma client
        # Tests and build both consume types from @prisma/client; ensure they
        # exist before downstream steps run.
        # Skipped when the cache hit matches the current schema hash.
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: npm run prisma:generate --workspace=api

      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle-budget
      - name: Web smoke tests
        # vitest — jest's --runInBand is not a valid flag here
        run: npm run test --workspace=web
      - name: Typecheck (spec files)
        # nest build uses tsconfig.build.json which excludes **/*spec.ts.
        # This separate tsc pass catches type errors in test files that the
        # build step silently skips.
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: API unit tests with coverage gate
        run: npm run test:cov --workspace=api -- --runInBand
      - name: OpenAPI smoke validation
        # Only runs when DATABASE_URL is exported — Nest test bootstrap exits
        # without it. Skipped on standard CI; runs in integration environments.
        if: env.DATABASE_URL != ''
        run: npm run test:e2e --workspace=api -- --testPathPattern openapi.e2e-spec
      - name: Upload API coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          # Path is relative to the repo root inside the runner checkout.
          path: apps/api/coverage
          if-no-files-found: ignore
