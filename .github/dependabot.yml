version: 2

# npm workspaces (apps/*, packages/*) share one package-lock.json at the repo
# root, so a single root entry updates every workspace together with the
# lockfile. Minor and patch bumps arrive as one grouped weekly PR; majors stay
# separate so each can be reviewed on its own.
#
# apps/mobile is an Expo SDK 54 app: expo modules, react, react-native and
# react-navigation must match the versions the SDK pins, or the native app
# breaks at runtime even when type-checks pass. Update those deliberately with
# `npx expo install --fix` / an SDK upgrade, not through Dependabot.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "babel-preset-expo"
      # @types/node tracks the Node runtime (22 LTS), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Workspaces declare these at different versions (React: web 19.3, mobile
      # 19.1.0 pinned by Expo; TypeScript: api 6.x, the rest 5.x), but
      # Dependabot sets a dependency to one version in every workspace that
      # declares it: a React "patch" PR moved mobile off Expo's pin and
      # downgraded web to 19.1. Upgrade these by hand, per workspace.
      - dependency-name: "typescript"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
