<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Softdigit Consulting helps retailers with inventory operations, dependable tooling, and Retail IMS — sign in to manage stock across stores."
    />
    <link rel="canonical" href="https://softdigitconsulting.com/" />
    <meta name="theme-color" content="#4f46e5" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Softdigit Consulting" />
    <meta property="og:title" content="Softdigit Consulting | Retail operations &amp; Retail IMS" />
    <meta
      property="og:description"
      content="Practical technology and inventory workflows for multi-store retail. Retail IMS sign-in available on this domain."
    />
    <meta property="og:url" content="https://softdigitconsulting.com/" />
    <meta property="og:image" content="https://softdigitconsulting.com/logo.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Softdigit Consulting | Retail operations &amp; Retail IMS" />
    <meta
      name="twitter:description"
      content="Practical technology and inventory workflows for multi-store retail."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=4" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />

    <title>Softdigit Consulting | Retail operations &amp; Retail IMS</title>
    <!-- Visible boot shell: paints before the JS bundle (fixes empty-root NO_FCP in Lighthouse). Replaced on React mount. -->
    <style>
      #app-boot-shell {
        box-sizing: border-box;
        margin: 0;
        min-height: 100vh;
        padding: 0 1.25rem 2rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif;
        line-height: 1.5;
        color: #0f172a;
        background: #f8fafc;
      }
      #app-boot-shell header {
        border-bottom: 1px solid #e2e8f0;
        background: #fff;
        margin: 0 -1.25rem 1.5rem;
        padding: 1rem 1.25rem;
      }
      #app-boot-shell .brand {
        font-size: 0.875rem;
        font-weight: 600;
        color: #0f172a;
      }
      #app-boot-shell .tag {
        font-size: 0.75rem;
        color: #475569;
        margin-top: 0.25rem;
      }
      #app-boot-shell main {
        max-width: 72rem;
        margin: 0 auto;
      }
      #app-boot-shell h1 {
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        font-weight: 600;
        line-height: 1.2;
        margin: 0 0 1rem;
        max-width: 40rem;
      }
      #app-boot-shell p {
        margin: 0 0 1rem;
        max-width: 36rem;
        color: #475569;
      }
      #app-boot-shell a {
        color: #4338ca;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #app-boot-shell a:focus-visible {
        outline: 2px solid #4f46e5;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-shell">
        <header style="display:flex;align-items:center;gap:0.75rem;">
          <img src="/logo.svg" width="40" height="40" alt="" aria-hidden="true" />
          <div>
            <div class="brand">Softdigit Consulting</div>
            <div class="tag">Retail operations &amp; technology</div>
          </div>
        </header>
        <main id="main">
          <h1>Practical technology for retailers who need clarity, control, and calm operations.</h1>
          <p>
            Inventory workflows, dependable tooling, and Retail IMS — sign in to manage stock across your stores.
          </p>
          <p style="font-size:0.875rem;color:#64748b;">Powered by softdigits</p>
          <p><a href="/login">Sign in to Retail IMS</a> · <a href="/">Home</a></p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
