<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SoftdigitIMS">
  <!-- Outer circle ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#1a1a8c" stroke-width="3"/>
  <!-- Gap at top-right for the stylized opening -->
  <path d="M 26 5 A 14 14 0 1 0 28.5 12" fill="none" stroke="#1a1a8c" stroke-width="3" stroke-linecap="round"/>
  <!-- White fill to create gap effect -->
  <path d="M 24 4 A 14 14 0 0 1 30 13" fill="none" stroke="white" stroke-width="4"/>
  <!-- Inner white circle -->
  <circle cx="16" cy="16" r="9" fill="white" stroke="#1a1a8c" stroke-width="1.5"/>
  <!-- SD letters -->
  <text x="16" y="20" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#1a1a8c">SD</text>
</svg>
